# docker-compose.yml

version: '3.8'

services:
  # Next.js应用
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: personabot-app
    ports:
      - "3000:3000"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/personabot
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-this}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-your-encryption-key-change-this}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com/v1}
      - LLM_MODEL=${LLM_MODEL:-gpt-4-turbo}
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./exes:/app/exes
      - ./backups:/app/backups
    restart: unless-stopped
    networks:
      - personabot-network

  # MongoDB数据库
  mongo:
    image: mongo:7
    container_name: personabot-mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-password}
      - MONGO_INITDB_DATABASE=personabot
    volumes:
      - mongo_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - personabot-network

  # Nginx反向代理（可选）
  nginx:
    image: nginx:alpine
    container_name: personabot-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - personabot-network
    profiles:
      - production

volumes:
  mongo_data:
    driver: local

networks:
  personabot-network:
    driver: bridge
